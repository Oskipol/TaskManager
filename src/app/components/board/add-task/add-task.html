<div
            class="absolute top-0 left-0 w-full h-full bg-gray-900 bg-opacity-50 flex justify-center items-center"
          >
            <div
              style="container-type: inline-size;"
              class="bg-gray-800 border-2 border-gray-500 hover:border-gray-400 fixed top-[50%] left-[50%] translate-x-[-50%] translate-y-[-50%] duration-300 z-10 lg:w-[40%] md:w-[60%] w-[70%] p-6 rounded-lg flex flex-col gap-4"
            >
              <h2 class="text-white text-2xl font-bold rationale-regular">Create New Task</h2>
              <input
                [(ngModel)]="title"
                type="text"
                class="bg-gray-600 text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Task title"
              />
              <textarea
                [(ngModel)]="description"
                class="bg-gray-600 text-white max-h-[70vh] min-h-[20vh] px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Task description"
              ></textarea>
             <select
    [(ngModel)]="assignee"
    class="bg-gray-600 text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
  >
    <option value="" disabled selected>Select Assignee</option>
    @if(store.isOwner()) {
      @for (member of members; track $index) {
        <option [value]="member">{{ member }}</option>
      }
      <option value="">Unassign</option>
    } @else if(store.isLeader()) {
      @for (member of members; track $index) {
        @if(member !== store.owner().toString() && (!store.Leaders().includes(member) || member === store.currentUser())) {
          <option [value]="member">{{ member }}</option>
        }
      }
      <option value="">Unassign</option>
    } @else if(store.isSupervisor()) {
      @for (member of members; track $index) {
        @if(member !== store.owner().toString() && !store.Leaders().includes(member) && (!store.Supervisors().includes(member) || member === store.currentUser())) {
          <option [value]="member">{{ member }}</option>
        }
      }
      <option value="">Unassign</option>
    } @else if(assignee == store.currentUser() || assignee == '') {
      @if(assignee == '') {
        <option [value]="store.currentUser()">{{ store.currentUser() }}</option>
      } @else {
        <option value="">Unassign</option>
      }
    }
  </select>
              <button
                (click)="CreateTask()"
                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 cursor-pointer duration-300 rounded"
              >
                Create
              </button>
              <button
                (click)="closed.emit()"
                class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 cursor-pointer duration-300 rounded"
              >
                Cancel
              </button>
            </div>
          </div>
