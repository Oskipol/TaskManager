<div style="container-type: inline-size;" class="absolute top-[50%] lg:w-[40%] md:w-[60%] border-2 border-amber-50 w-[70%] z-10 left-[50%] translate-x-[-50%] translate-y-[-50%] bg-gray-800 p-6 rounded-lg">
            <button (click)="closed.emit()" class="absolute cursor-pointer top-2 right-2 text-white hover:text-gray-300">
              ✕
            </button>
            <h2 style="font-size: 10cqi;" class="text-white text-2xl font-bold rationale-regular text-center">Task Info</h2>
            <p style="font-size: 7cqi;" class="text-gray-300"><span class="font-bold">Title:</span> {{selectedTask?.title}}</p>
            <p style="font-size: 7cqi;" class="text-gray-300"><span class="font-bold">Status: </span> <span class="inline-block" [class]="selectedTask?.status=='todo' ? 'text-red-500' : (selectedTask?.status=='in-progress' ? 'text-gray-300' : 'text-green-500')">{{selectedTask?.status}}</span></p>
            <p style="font-size: 7cqi;" class="text-gray-300"><span class="font-bold">Assignee:</span> {{selectedTask?.assignedTo || 'Free'}}</p>
            <span class="font-bold text-white" style="font-size: 7cqi;">Description:</span>
            <p style="font-size: 6cqi; white-space: pre-wrap;" class="text-gray-300 overflow-scroll max-h-[50vh] bg-gray-700 p-2 rounded-2xl">{{selectedTask?.description}}</p>
            <button (click)="UpdateTask()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 cursor-pointer duration-300 rounded">
              Update
            </button>
          </div>
