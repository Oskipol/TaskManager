<div class="w-full h-full inset-0 min-h-screen bg-gray-800">
      <div
        style="container-type: inline-size;"
        class="fixed top-0 z-10 left-0 bg-gray-900 h-[10vh] min-h-15 w-full flex justify-between items-center px-[2%]"
      >
        <h1 style="font-size: 5cqi;" class="rationale-regular font-bold text-white">
          Your Tasks
        </h1>
        <div class="flex gap-5">
          <button
            class="bg-green-500 flex justify-center items-center hover:bg-green-700 text-white font-bold py-2 px-4 cursor-pointer duration-300 rounded"
          >
            <button class="cursor-pointer hidden md:block">Add Task</button>
            <div class="h-full aspect-square bg-[url('/plus.png')] bg-cover bg-center block md:hidden"></div>
          </button>
          <button
            routerLink="/dashboard"
            class="bg-blue-500 flex justify-center items-center hover:bg-blue-700 text-white font-bold py-2 px-4 cursor-pointer duration-300 rounded"
          >
            <button class="cursor-pointer hidden md:block">Back</button>
            <div class="h-full aspect-square bg-[url('/arrow.png')] bg-cover bg-center block md:hidden"></div>
          </button>
          <div class="w-10 aspect-square flex justify-center items-center cursor-pointer hover:rotate-180 duration-300" style="background-image: url('/gear.png'); background-size: cover; background-position: center;">
            <div class="w-[40%] h-[40%] rounded-[50%] bg-gray-700"></div></div>
        </div>
        
</div>
@if(TaskInfoMode()){
          <app-task-info2 [selectedTask]="selectedTask()" (closed)="TaskInfoMode.set(false)"></app-task-info2>
        }
<div class="w-full flex flex-col gap-5 min-h-[90vh] p-4 md:p-10 mt-[10vh]">
  @if(tasks().length==0){
    <p class="text-gray-300 text-center" style="font-size: 5cqi;">You have no tasks assigned to you.</p>
  }
  @for(task of tasks(); track task.id){

  <div (click)="TaskInfo(task)" class="w-full cursor-pointer rounded-2xl overflow-hidden flex flex-col md:flex-row">

    <div class="w-full md:w-[40%] bg-gray-500 p-4 md:p-6 flex flex-col justify-center gap-2">
      <h2 class="text-white rationale-regular text-lg md:text-2xl lg:text-4xl font-bold break-word">
        {{task.createdBy}} - {{task.title}}
      </h2>

      <p class="text-gray-200 text-sm md:text-lg lg:text-2xl">
        Board: {{ giveBoard(task) }}
      </p>
    </div>

    <div class="w-full md:w-[60%] bg-gray-700 p-4 md:p-6 flex flex-col gap-2 md:gap-4 justify-center">

      <p class="text-white text-sm md:text-lg lg:text-2xl">
        State:
        <span
          [ngClass]="{
            'text-green-500': task.status === 'done',
            'text-yellow-500': task.status === 'in-progress',
            'text-red-500': task.status === 'todo'
          }"
        >
          {{task.status}}
        </span>
      </p>

      <p class="text-white text-sm md:text-lg lg:text-2xl">
        Time left: {{giveDate(task)}}
      </p>

      <p class="text-white text-sm md:text-lg lg:text-2xl">
        Points: {{task.points}}
      </p>

    </div>

  </div>

  }

</div>
