 <div class="w-full min-h-screen bg-gray-900 flex justify-center items-center">
      <div style="container-type: inline-size;" class="lg:w-[30%] md:w-[40%] w-[70%] py-[5%] bg-gray-800 rounded-2xl flex flex-col items-center gap-4">
        <h1 style="font-size: 10cqi;" class="text-white font-bold rationale-regular">Reset Password</h1>
        <input [value]="password1" (input)="password1 = $any($event.target).value" type="password" placeholder="New password"
          class="bg-gray-700 w-[80%] text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"/>
        <input [value]="password2" (input)="password2 = $any($event.target).value" type="password" placeholder="Repeat password"
          class="bg-gray-700 w-[80%] text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"/>
        @if(message()) {
          <p class="text-green-400">{{ message() }}</p>
        }
        @if(error()) {
          <p class="text-red-400">{{ error() }}</p>
        }
        <button (click)="reset()" class="bg-blue-600 hover:bg-blue-700 duration-300 cursor-pointer text-white py-2 px-8 rounded-lg">
          Reset
        </button>
      </div>
    </div>
